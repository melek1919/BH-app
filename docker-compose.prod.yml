# docker-compose.prod.yml — mode PULL (aucun build sur le serveur)
# Les images backend/frontend sont tirées depuis Docker Hub (publiées par le pipeline Jenkins).
# Copier ce dossier sur le serveur, créer un .env (voir .env.prod.example), puis :
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    image: melek1919/bh-app-backend:latest
    container_name: bh-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-4h}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - bh-network

  frontend:
    image: melek1919/bh-app-frontend:latest
    container_name: bh-frontend
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - bh-network

  db:
    image: postgres:15-alpine
    container_name: bh-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - bh-network

volumes:
  postgres_data:

networks:
  bh-network:
    driver: bridge